name: Build TOOFAN APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Build TOOFAN with 3D T Icon + All 12 Points
        run: |
          flutter pub add supabase_flutter
          flutter pub get
          echo "Checking icon..."
          ls -la | grep icon
          mkdir -p android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          if [ -f "icon.png" ]; then for d in android/app/src/main/res/mipmap-*; do cp icon.png $d/ic_launcher.png; done; echo "Icon OK"; else echo "icon.png not in root, skipping icon step"; fi
          if [ -f "ICON.PNG" ]; then for d in android/app/src/main/res/mipmap-*; do cp ICON.PNG $d/ic_launcher.png; done; fi
          if [ -f "Icon.png" ]; then for d in android/app/src/main/res/mipmap-*; do cp Icon.png $d/ic_launcher.png; done; fi
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TOOFAN-FINAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
