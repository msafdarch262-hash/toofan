name: Build TOOFAN APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Build TOOFAN FINAL with Your 3D T Icon + All 12 Points
        run: |
          cp lib/main.dart /tmp/m.dart
          flutter create . --platforms=android --project-name toofan --org com.toofan.app
          cp /tmp/m.dart lib/main.dart
          flutter pub add supabase_flutter
          flutter pub get
          if [ -f icon.png ]; then echo "Your 3D T Icon Found!"; mkdir -p android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; for d in android/app/src/main/res/mipmap-*; do cp icon.png $d/ic_launcher.png; done; fi
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TOOFAN-FINAL-3D-T-Icon-All-Features
          path: build/app/outputs/flutter-apk/app-release.apk
