name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.24.5', channel: 'stable'}
      - run: |
          rm -rf android ios web
          flutter create . --org com.toofan.app --project-name toofan --platforms=android
          flutter pub add supabase_flutter
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'dart:async';
          import 'package:supabase_flutter/supabase_flutter.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Supabase.initialize(
              url: 'https://xekkhzuqmnoxnoybuncz.supabase.co',
              anonKey: 'sb_publishable_fhB6tL6Fi_OUbRLYAMe3ZQ_uIM__-k8',
            );
            runApp(const ToofanApp());
          }
          class ToofanApp extends StatelessWidget{
            const ToofanApp({super.key});
            @override Widget build(BuildContext c)=>MaterialApp(debugShowCheckedModeBanner:false, home:const SplashScreen());
          }
          class SplashScreen extends StatefulWidget{ const SplashScreen({super.key}); @override State<SplashScreen> createState()=>_SplashScreenState(); }
          class _SplashScreenState extends State<SplashScreen>{
            @override void initState(){ super.initState(); Timer(const Duration(seconds:2), ()=>Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const LoginScreen()))); }
            @override Widget build(BuildContext c)=>Scaffold(body:Container(decoration: const BoxDecoration(gradient: LinearGradient(colors: [Color(0xFF6A5AE0), Color(0xFF00C6FF)])), child:Center(child:Container(width:140,height:140,decoration:BoxDecoration(color:Colors.white, borderRadius:BorderRadius.circular(35)), child:const Center(child:Text("T", style:TextStyle(fontSize:90, fontWeight:FontWeight.w900, color:Color(0xFF6A5AE0)))))))));
          }
          class LoginScreen extends StatefulWidget{ const LoginScreen({super.key}); @override State<LoginScreen> createState()=>_LoginState(); }
          class _LoginState extends State<LoginScreen>{
            final email=TextEditingController(); final pass=TextEditingController(); bool isLogin=true; bool loading=false;
            Future<void> auth() async {
              setState(()=>loading=true);
              try{
                if(isLogin){ await Supabase.instance.client.auth.signInWithPassword(email: email.text, password: pass.text); }
                else{ await Supabase.instance.client.auth.signUp(email: email.text, password: pass.text); }
                if(mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const MainApp()));
              }catch(e){ if(mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString()))); }
              if(mounted) setState(()=>loading=false);
            }
            @override Widget build(BuildContext c)=>Scaffold(body:Container(padding:const EdgeInsets.all(25), decoration:const BoxDecoration(gradient:LinearGradient(colors:[Color(0xFF1A1A2E), Color(0xFF16213E)])), child:Column(mainAxisAlignment:MainAxisAlignment.center, children:[const Text("TOOFAN ONLINE", style:TextStyle(color:Colors.white, fontSize:32, fontWeight:FontWeight.w900)), const SizedBox(height:25), TextField(controller:email, style:const TextStyle(color:Colors.white), decoration:const InputDecoration(hintText:"Email", hintStyle:TextStyle(color:Colors.white54), filled:true, fillColor:Colors.white12, border:OutlineInputBorder())), const SizedBox(height:10), TextField(controller:pass, obscureText:true, style:const TextStyle(color:Colors.white), decoration:const InputDecoration(hintText:"Password", hintStyle:TextStyle(color:Colors.white54), filled:true, fillColor:Colors.white12, border:OutlineInputBorder())), const SizedBox(height:20), SizedBox(width:double.infinity, height:55, child:ElevatedButton(style:ElevatedButton.styleFrom(backgroundColor:Color(0xFF6A5AE0)), onPressed:loading?null:auth, child:loading?const CircularProgressIndicator(color:Colors.white):Text(isLogin?"LOGIN ONLINE":"SIGNUP ONLINE"))), TextButton(onPressed:()=>setState(()=>isLogin=!isLogin), child:Text(isLogin?"New? Signup":"Have Account? Login", style:const TextStyle(color:Colors.white70)))])));
          }
          class MainApp extends StatelessWidget{ const MainApp({super.key}); @override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text("TOOFAN - ONLINE 12 Points"), backgroundColor:Colors.black), body:Center(child:Column(mainAxisAlignment:MainAxisAlignment.center, children:[const Icon(Icons.check_circle, color:Colors.green, size:80), const SizedBox(height:15), const Text("ONLINE CONNECTED!", style:TextStyle(color:Colors.white, fontSize:22, fontWeight:FontWeight.bold)), const SizedBox(height:10), Text("User: ${Supabase.instance.client.auth.currentUser?.email??''}", style:const TextStyle(color:Colors.white70)), const SizedBox(height:20), ElevatedButton(onPressed:() async { await Supabase.instance.client.auth.signOut(); }, child:const Text("Logout"))]))); }
          DART
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: TOOFAN-ONLINE-FINAL
          path: build/app/outputs/flutter-apk/app-debug.apk
