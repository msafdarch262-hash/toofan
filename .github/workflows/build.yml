name: Build TOOFAN APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Build TOOFAN with 3D T Icon + All 12 Points
        run: |
          echo "Saving your main.dart"
          cp lib/main.dart /tmp/main.dart
          echo "Fixing Android v1 embedding - recreating android folder"
          flutter create . --platforms=android --org com.toofan.app --project-name toofan --overwrite
          cp /tmp/main.dart lib/main.dart
          flutter pub add supabase_flutter
          flutter pub get
          echo "Fixing icon name icon-png.jpg -> icon.png"
          ls -lh | grep icon
          if [ -f "icon-png.jpg" ]; then cp "icon-png.jpg" icon.png; echo "Renamed icon-png.jpg to icon.png"; fi
          if [ -f "icon-png.png" ]; then cp "icon-png.png" icon.png; fi
          mkdir -p android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          if [ -f "icon.png" ]; then for d in android/app/src/main/res/mipmap-*; do cp icon.png $d/ic_launcher.png; done; echo "3D T Icon Added!"; fi
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TOOFAN-FINAL-3D-ICON-APK
          path: build/app/outputs/flutter-apk/app-release.apk
